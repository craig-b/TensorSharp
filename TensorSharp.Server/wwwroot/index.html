<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TensorSharp Chat</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<header>
  <h1>
    <a class="brand-site-link" href="https://tensorsharp.ai" target="_blank" rel="noopener" title="Visit TensorSharp.ai">&#x1F310; TensorSharp.ai <span class="link-arrow">&#x2197;</span></a>
  </h1>
  <div class="header-controls">
    <span id="queue-badge" class="status-badge hidden" title="Live inference load: requests processing concurrently and waiting in the queue"></span>
    <span id="status-badge" class="status-badge">No model configured</span>
    <button id="btn-clear" title="New chat">&#x2795; New Chat</button>
  </div>
</header>

<div id="api-key-banner" class="api-key-banner" hidden>
  <span class="api-key-msg" id="api-key-msg">This server requires an API key.</span>
  <form id="api-key-form">
    <input type="password" id="api-key-input" placeholder="API key" autocomplete="off">
    <button type="submit">Save</button>
  </form>
</div>

<div class="main-area">
  <div id="chat-container">
    <div class="empty-state" id="empty-state">
      <a class="brand-home" href="https://tensorsharp.ai" target="_blank" rel="noopener" title="Visit tensorsharp.ai"><div class="big-wordmark" aria-label="TensorSharp">TensorSharp</div></a>
      <p>Start TensorSharp.Server with <code>--model &lt;path.gguf&gt; --backend &lt;type&gt; [--mmproj &lt;path&gt;] [--max-tokens 20000]</code>, then refresh this page.</p>
    </div>
  </div>

  <div id="input-area">
    <div class="attachments" id="attachments"></div>
    <div class="model-switcher" id="model-switcher">
      <label class="reasoning-toggle" title="Enable reasoning / chain-of-thought output">
        <input type="checkbox" id="reasoning-toggle" checked>
        <span class="toggle-track"></span>
        <span>Reasoning</span>
      </label>
    </div>
    <div class="input-row">
      <div class="input-wrapper">
        <textarea id="message-input" placeholder="Type a message..." rows="1"></textarea>
        <div class="input-actions">
          <button id="btn-attach" title="Attach file">&#x1F4CE;</button>
          <button class="send-btn" id="btn-send">&#x27A4;</button>
        </div>
      </div>
    </div>
    <input type="file" id="file-input" multiple accept="image/*,video/*,audio/*,.pdf,.heic,.heif,.txt,.csv,.json,.xml,.md,.log,.py,.js,.ts,.cs,.java,.cpp,.c,.h,.html,.css,.yaml,.yml,.toml,.ini,.cfg,.sh,.bat,.ps1,.rb,.go,.rs,.swift,.kt,.sql,.r,.m,.tex,.rtf">
  </div>
</div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
